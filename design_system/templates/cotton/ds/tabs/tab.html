<c-vars
  as="a"
  class=""
  modifier=""

    'active': 'tab-active',
    'disabled': 'tab-disabled',

/>


<{{ as }}
  role="tab"
  class="tab {{ modiferClasses|get_item:modifier }} {{ class }}"

>
