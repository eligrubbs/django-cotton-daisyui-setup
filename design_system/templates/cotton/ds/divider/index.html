{% comment %}
DaisyUI Divider Component

https://daisyui.com/components/divider/

{% endcomment %}


<c-vars
  as="div"
  class=""
  color=""
  :colorClasses="{
    '': '',
    'neutral': 'divider-neutral',
    'primary': 'divider-primary',
    'secondary': 'divider-secondary',
    'accent': 'divider-accent',
    'info': 'divider-info',
    'success': 'divider-success',
    'warning': 'divider-warning',
    'error': 'divider-error'
  }"
  direction=""
  :directionClasses="{
    '': '',
    'horizontal': 'divider-horizontal',
    'vertical': 'divider-vertical'
  }"
  placement=""
  :placementClasses="{
    '': '',
    'start': 'divider-start',
    'end': 'divider-end'
  }"
/>

<{{ as }} class="divider {{ colorClasses|get_item:color }} {{ directionClasses|get_item:direction }} {{ placementClasses|get_item:placement }} {{ class }}" {{ attrs }}>{{ slot }}</{{ as }}>
