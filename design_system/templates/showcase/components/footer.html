{% extends "showcase/_base.html" %}

{% block title %}Footer Showcase{% endblock %}

<div class="mb-8">

    <p class="text-base-content/70">Demo of DaisyUI Footer.</p>
</div>

<section class="space-y-8 bg-base-100 p-6 rounded-box shadow-sm border border-base-300">

  <div>
    <h3>Footer</h3>
    <c-ds.footer class="sm:footer-horizontal bg-neutral text-neutral-content p-10">
      <nav>
        <c-ds.footer.title as="h6">Services</c-ds.footer.title>
        <a class="link link-hover">Branding</a>

        <a class="link link-hover">Marketing</a>
        <a class="link link-hover">Advertisement</a>

      <nav>
        <c-ds.footer.title as="h6">Company</c-ds.footer.title>
        <a class="link link-hover">About us</a>
        <a class="link link-hover">Contact</a>
        <a class="link link-hover">Jobs</a>
        <a class="link link-hover">Press kit</a>
      </nav>
      <nav>
        <c-ds.footer.title as="h6">Legal</c-ds.footer.title>
        <a class="link link-hover">Terms of use</a>
        <a class="link link-hover">Privacy policy</a>
        <a class="link link-hover">Cookie policy</a>
      </nav>
    </c-ds.footer>
